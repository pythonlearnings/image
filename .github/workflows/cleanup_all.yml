name: "🧹 Cleanup Releases, Tags and Actions runs"

on:
  workflow_dispatch:
    inputs:
      wipe_releases:
        description: "Delete all Releases and Tags"
        type: boolean
        default: true
      wipe_runs:
        description: "Delete previous Actions runs"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clean selected resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WIPE_RELEASES: ${{ inputs.wipe_releases }}
          WIPE_RUNS: ${{ inputs.wipe_runs }}
        run: |
          set -euo pipefail
          failed=0

          clean() {
            local label=$1 list_endpoint=$2 filter=$3 delete_endpoint=$4
            local items id deleted=0 errors=0
            if ! items=$(gh api --paginate "$list_endpoint" --jq "$filter"); then
              echo "::error::Could not list $label"
              failed=1
              return
            fi
            while IFS= read -r id; do
              if [[ -z "$id" ]]; then
                continue
              fi
              if gh api --method DELETE --silent "$delete_endpoint/$id"; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Could not delete $label item $id"
                errors=$((errors + 1))
              fi
            done <<< "$items"
            echo "$label: $deleted deleted, $errors failed" | tee -a "$GITHUB_STEP_SUMMARY"
            if (( errors > 0 )); then
              failed=1
            fi
          }

          if [[ "$WIPE_RELEASES" == true ]]; then
            clean Releases "repos/$REPO/releases?per_page=100" '.[].id' "repos/$REPO/releases"
            clean Tags "repos/$REPO/tags?per_page=100" '.[].name | split("/") | map(@uri) | join("/")' "repos/$REPO/git/refs/tags"
          fi
          if [[ "$WIPE_RUNS" == true ]]; then
            clean 'Actions runs' "repos/$REPO/actions/runs?per_page=100" \
              ".workflow_runs[] | select(.id != $RUN_ID) | .id" "repos/$REPO/actions/runs"
          fi
          exit "$failed"
